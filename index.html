<style>
/* 古地図：生成りの紙、墨の文字。選び肢は白い札に緑の縁、問いは朱の縁 */

}
html,body{min-height:100%}
body{margin:0;background-color:var(--bg);background-image:repeating-linear-gradient(90deg,transparent 0 46px,#8a7d6812 46px 48px);color:var(--ink);font-family:var(--f-body);font-weight:500;overflow-x:hidden;-webkit-tap-highlight-color:transparent}

header{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:44px}

.dots i.on{background:var(--mt);border-color:var(--mt);height:11px;margin-top:-2px}.dots i.done{background:var(--ink);border-color:var(--ink)}
button.main{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 8px;min-height:54px;border-radius:12px;background:var(--green);color:#fff;font-weight:700;font-size:17px;padding:6px 16px;text-align:center;box-shadow:0 4px 0 var(--green2)}

.row{display:flex;gap:10px}.row>.sub,.row>.main{flex:1 1 0}

.hero{display:flex;align-items:center;justify-content:center;gap:14px;padding:14px;border-radius:14px;border:1.5px solid var(--border);background:var(--paper)}
.hero .card{font-family:var(--f-title);font-weight:900;font-size:22px;line-height:1.3;min-width:72px;padding:12px 10px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:#fff;border:3px solid var(--green);letter-spacing:.08em}
.hero .card.yo{border-color:var(--mt);color:var(--mt2)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.mlist .pk{flex:none;width:44px;display:flex;justify-content:center;color:var(--ink)}.mlist .pk .pic{width:34px;height:auto}.mlist .pk .sym{font-size:16px}

.fuda button.cut{opacity:.4;border-style:dotted}
.fuda button.yes{background:var(--green);border-color:var(--green2);color:#fff}.fuda button.yes .no{color:#fff}

.inp{display:flex;gap:8px}

.inp input:disabled{background:var(--paper)}
.inp button.main{flex:none;min-width:96px}
.tried{margin:0;text-align:center;font-size:14px;color:var(--ink2)}
.tried s{color:var(--red)}
.msg{margin:0;min-height:22px;text-align:center;font-size:15px;font-weight:700}
.msg.bad{color:var(--red)}
.msg.ok{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;min-height:0} /* 正解の知らせは読み上げだけ（見た目は下の正解の箱） */
.hint{background:var(--paper);border:1.5px dashed var(--green);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.7}
.verdict{background:var(--paper);border:1.5px solid var(--ink);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;box-shadow:0 6px 0 #211c1620;animation:up .35s ease-out}
@keyframes up{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}

.verdict ul{margin:0;padding-left:1.1em;line-height:1.8;font-size:15px}

.verdict .uta small{display:block;font-family:var(--f-body);font-weight:500;font-size:13px;color:var(--ink2);letter-spacing:.04em}
.stars{color:var(--gold);letter-spacing:.08em;font-size:20px}
.stars .off{color:#211c1633}

.big{font-weight:900;font-size:25px;text-align:center;margin:0}

.shares{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.shares a,.shares button{display:flex;align-items:center;justify-content:center;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-size:14px;font-weight:700;text-decoration:none;padding:0 6px;box-sizing:border-box;font-family:inherit;cursor:pointer}
.rlist{display:flex;flex-direction:column;gap:8px}
.rlist div{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px 12px}

.ach .pg{grid-area:pg;font-size:13px;color:var(--ink2);white-space:nowrap}

.area{display:flex;flex-direction:column;gap:6px}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{font-size:11px;color:var(--ink2);text-align:center}

.cal .c i{font-style:normal;font-size:9px;color:var(--gold)}
.cal .c.p1{background:#ecefe9}.cal .c.p2{background:#d3e2d6}.cal .c.p3{background:var(--green);color:#fff;border-color:var(--green2)}.cal .c.p3 i{color:#ffe9a8}

.cal .c.p3 .hd{color:#ffe9a8}
.cal .c.off{visibility:hidden}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center;font-size:12px;color:var(--ink2)}
.about{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:6px 14px;font-size:14px;line-height:1.8}

<script id="a11y-script">
/* 見やすさの設定（色覚・ディスレクシア・弱視・動きに弱い人のため）。外へは何も送らない。
   設定は localStorage の a11y-v1 に置く。同じサイト（satou-aaaaa.github.io）のゲームは同じ設定を使う。
   ゲームの側でできること：
   - 設定を開くボタンに data-a11y-open を付ける（無ければ左下に「Aa」のボタンを出す）
   - 読み上げる文に data-a11y-say を付ける（問題文・知らせなど）
   - 色の見分けを助ける形・模様は html.a11y-cvd の下に CSS で書く。JS では A11y.on('cvd')
   - 揺れ・すべる動きを JS で動かすときは、A11y.on('calm') なら止める
   - 設定が変わると document に a11ychange が届く
   - 設定の印は html の class「a11y-<設定の名前>」（a11y-read など）。部品の class はこれと重ならない名前にする（2026-11-05 a11y-say がボタンとぶつかった） */
(() => {
  const KEY = "a11y-v1";
  const root = document.documentElement;
  const OPTS = [
    ["read", "読みやすい文字", "UD フォント・行間と字間を広く"],
    ["cvd", "色の見分けを助ける", "色に形・模様・記号を足す"],
    ["calm", "動きを減らす", "揺れ・点滅・すべる動きを止める"],
    ["say", "読み上げのボタンを出す", "問題や知らせを声で読む（端末の中の声だけ）"],
    ["ruby", "ふりがなを出す", "むずかしい漢字に読みを付ける"],
  ];
  const media = (q) => { try { return matchMedia(q).matches; } catch { return false; } };
  // 保存した値がオブジェクトでなければ（別のページが書いた・手で直した）無かったことにする（2026-11-05 CodeRabbit：true が入ると設定が開けなくなる）
  const load = () => { try { const v = JSON.parse(localStorage.getItem(KEY) || "{}"); return v && typeof v === "object" && !Array.isArray(v) ? v : {}; } catch { return {}; } };
  let S = load();
  // 決めていないものは端末の設定に合わせる（視差効果を減らす → 動きを減らす）
  const on = (k) => (k in S ? !!S[k] : k === "calm" ? media("(prefers-reduced-motion: reduce)") : false);
  let fontLoaded = false;
  const loadFont = () => {
    if (fontLoaded) return; fontLoaded = true;
    // Google Fonts を許しているページだけ取りに行く（許していなければ端末にある UD フォントを使う）
    const csp = (document.querySelector('meta[http-equiv="Content-Security-Policy"]') || {}).content || "";
    if (csp && !/fonts\.googleapis\.com/.test(csp)) return;
    const l = document.createElement("link");
    l.rel = "stylesheet"; l.href = "https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap";
    document.head.appendChild(l);
  };
  const apply = () => {
    for (const [k] of OPTS) root.classList.toggle("a11y-" + k, on(k));
    if (on("read")) loadFont();
    if (sayBtn) sayBtn.hidden = !on("say");
    if (!on("say")) stop();
  };
  const set = (k, v) => {
    S = { ...S, ...load() }; // 別のタブで変えた設定を消さないよう、書く前に読み直す
    S[k] = !!v;
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch { /* 保存できなくても今の画面には効かせる */ }
    apply();
    document.dispatchEvent(new CustomEvent("a11ychange", { detail: { key: k, on: !!v } }));
  };

  // 読み上げ：端末の中の日本語の声だけを使う（外へ文字を送る声は使わない）
  const voice = () => { try { return speechSynthesis.getVoices().find((v) => /^ja/i.test(v.lang) && v.localService) || null; } catch { return null; } };
  const stop = () => { try { speechSynthesis.cancel(); } catch { /* 無い端末 */ } };
  const visible = (el) => { const r = el.getBoundingClientRect(); const cs = getComputedStyle(el); return r.width > 0 && r.height > 0 && cs.visibility !== "hidden" && !el.closest("[hidden],[aria-hidden=true],[inert]"); };
  const textOf = (sel) => [...document.querySelectorAll(sel)].filter(visible).map((el) => (el.getAttribute("aria-label") || el.innerText || "").trim()).filter(Boolean).join("。");
  // data-a11y-say が無い画面では、見出しと知らせの場所を読む（2026-11-05 何も読まれず設定が開くだけだった）
  const sayText = () => textOf("[data-a11y-say]") || textOf("h1,h2,[role=status],[aria-live]");
  const say = (text) => {
    const v = voice();
    if (!v || !text) return false;
    stop();
    const u = new SpeechSynthesisUtterance(text.slice(0, 600));
    u.voice = v; u.lang = v.lang; u.rate = 0.95;
    speechSynthesis.speak(u);
    return true;
  };

  let dlg = null, sayBtn = null, lastFocus = null;
  const build = () => {
    dlg = document.createElement("dialog");
    dlg.className = "a11y-dlg";
    dlg.setAttribute("aria-labelledby", "a11y-h");
    const hasRuby = !!document.querySelector("ruby.a11y-rb");
    dlg.innerHTML = `<h2 id="a11y-h">見やすさ・読みやすさ</h2><p>ほかのゲームにも同じ設定が使われます。文字は2本の指で広げると大きくなります。</p>` +
      OPTS.filter(([k]) => k !== "ruby" || hasRuby).map(([k, n, d]) => `<label><input type="checkbox" data-k="${k}"><span>${n}<small>${d}</small></span></label>`).join("") +
      `<p class="a11y-note" id="a11y-novoice" hidden>この端末には、外へ送らずに読める日本語の声がありません。</p><div class="a11y-row"><button type="button" class="a11y-ok" data-a11y-close>閉じる</button></div>`;
    document.body.appendChild(dlg);
    dlg.addEventListener("change", (e) => {
      const k = e.target.dataset && e.target.dataset.k;
      if (!k) return;
      set(k, e.target.checked);
      if (k === "say") dlg.querySelector("#a11y-novoice").hidden = !(e.target.checked && !voice());
    });
    // dialog を知らないブラウザでは close が無いので、open を外して閉じ、フォーカスを戻す（v6。jitensha-rule #1・sekai-jikoku #1 の CodeRabbit）
    dlg.querySelector("[data-a11y-close]").addEventListener("click", () => { if (dlg.close) dlg.close(); else { dlg.removeAttribute("open"); if (lastFocus && lastFocus.focus) lastFocus.focus(); } });
    dlg.addEventListener("close", () => { if (lastFocus && lastFocus.focus) lastFocus.focus(); });
    sayBtn = document.createElement("button");
    sayBtn.type = "button"; sayBtn.className = "a11y-saybtn"; sayBtn.textContent = "🔊 読む"; sayBtn.setAttribute("aria-label", "画面の問題を読み上げる");
    sayBtn.addEventListener("click", () => {
      try { if (speechSynthesis.speaking) return stop(); } catch { /* 無い端末 */ }
      if (!say(sayText())) open();
    });
    document.body.appendChild(sayBtn);
    if (!document.querySelector("[data-a11y-open]")) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "a11y-btn a11y-float"; b.textContent = "Aa"; b.setAttribute("data-a11y-open", ""); b.setAttribute("aria-label", "見やすさの設定");
      document.body.appendChild(b);
    }
    document.addEventListener("click", (e) => { const t = e.target.closest && e.target.closest("[data-a11y-open]"); if (t) { e.preventDefault(); open(); } });
    apply();
  };
  const open = () => {
    if (!dlg) build();
    lastFocus = document.activeElement;
    for (const c of dlg.querySelectorAll("input[data-k]")) c.checked = on(c.dataset.k);
    dlg.querySelector("#a11y-novoice").hidden = !(on("say") && !voice());
    if (dlg.showModal) dlg.showModal(); else dlg.setAttribute("open", "");
  };
  // 声の一覧はあとから届くことがある。届いたら「声がありません」を出し直す
  try { speechSynthesis.addEventListener("voiceschanged", () => { if (dlg) dlg.querySelector("#a11y-novoice").hidden = !(on("say") && !voice()); }); } catch { /* 無い端末 */ }
  apply();
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", build); else build();
  window.A11y = { on, set, open, say, stop };
})();
</script>
<!-- a11y:end -->

<script>
"use strict";
const $ = (id) => document.getElementById(id), app = $("app");
const SITE = "https://satou-aaaaa.github.io/shukujitsu-yurai/";
const FEEDBACK = "https://github.com/satou-aaaaa/shukujitsu-yurai/issues/new?template=feedback.yml";
const KEY = "shuku-v1";
const G = window.SHUKU, LV = G.LV, EPOCH = G.EPOCH;

// ---- 日付（日本時間。だれでも同じ5問）----
const jstNow = () => new Date(Date.now() + 9 * 3600e3);
const todayKey = () => jstNow().toISOString().slice(0, 10);
const dayNo = (k) => G.dayIdx(k) + 1;
const nextDay = (k) => new Date(Date.parse(k) + 864e5).toISOString().slice(0, 10);
const prevDay = (k) => new Date(Date.parse(k) - 864e5).toISOString().slice(0, 10);
const md = (k) => `${+k.slice(5, 7)}/${+k.slice(8, 10)}`;
const listOf = (mode, date) => (mode === "h" ? G.hardTags(date) : G.dailyTags(date));
const noOf = (qid) => G.QBY[qid].no;

// ---- 練習・とことん：毎回ちがう並び（乱数は練習ととことんだけ）----
const rid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const mix = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
// まだ祝日の帳に無い祝日の問題を先に出す
const freshFirst = (qs, s) => { const seen = (s && s.dex) || {}, nw = (q) => !seen[noOf(q)]; return [...mix(qs.filter(nw)), ...mix(qs.filter((q) => !nw(q)))]; };
// とことん：やさしい5 → ふつう10 → あとはむずかしい（1つの並びの中で同じ問題を出さない・続けて同じ祝日を出さない）
const evN = (qid) => G.evOf(qid)[0]; // 続けて出さない単位（祝日）
function endlessList(s, avoid, hard) {
  const salt = rid(), out = [], k = todayKey();
  const take = (lv, n) => {
    const st = out.length, ids = freshFirst(G.POOL[lv], s), used = new Set(out.map((x) => evN(x[1])));
    // 同じ回の中では、なるべくまだ出していない祝日から（使い切ったら同じ祝日も出す）
    ids.sort((a, b) => used.has(evN(a)) - used.has(evN(b)));
    for (let c = 0; c < n && ids.length; c++) {
      const prev = out.length ? out[out.length - 1][1] : avoid, pn = prev && G.QBY[prev] ? evN(prev) : -1;
      const j = ids.findIndex((q) => evN(q) !== pn);
      if (j >= 0) { out.push([lv, ids.splice(j, 1)[0]]); continue; }
      // 残りが同じ祝日だけのときは、前のほうの、となりと重ならない所へはさむ
      const q = ids.shift(), e = evN(q); let at = -1;
      for (let x = out.length - 1; x > st && at < 0; x--) if (evN(out[x - 1][1]) !== e && evN(out[x][1]) !== e) at = x;
      if (at < 0) out.push([lv, q]); else out.splice(at, 0, [lv, q]);
    }
  };
  if (!hard) { take(0, 5); take(1, 10); }
  take(2, G.POOL[2].length);
  return out.map(([lv, id], i) => `${lv}:${id}|e${k}.${salt}.${i}`);
}
// 練習：難しさと、祝日の組を選んで5問
function practiceList(s, lv, fam) {
  let pool = G.POOL[lv].filter((q) => fam == null || G.BY[noOf(q)].ar === fam); if (pool.length < 5) pool = G.POOL[lv];
  const ids = freshFirst(pool, s).slice(0, 5), salt = rid(), k = todayKey();
  return ids.map((id, i) => `${lv}:${id}|p${k}.${salt}.${i}`);
}
// にがて復習：まちがえた・ヒントを使った問題を、回数の多い順に5問（足りなければまだの問題で補う）。一度でまちがいなしに当てると外れる
const NGMAX = 60;
const ngIds = (s) => Object.keys(s.ng).filter((q) => has(G.QBY, q) && s.ng[q] > 0).sort((a, b) => s.ng[b] - s.ng[a] || (a < b ? -1 : 1));
function reviewList(s) {
  const k = todayKey(), salt = rid(), ids = ngIds(s).slice(0, 5);
  for (const lv of [0, 1, 2]) for (const q of freshFirst(G.POOL[lv], s)) { if (ids.length >= 5) break; if (!ids.includes(q)) ids.push(q); }
  return ids.map((id, i) => `${G.QBY[id].lv}:${id}|p${k}.${salt}.r${i}`);
}
const ngBtn = () => { const n = ngIds(load()).length; return n ? `<button class="sub" id="go-r">にがて復習 <small>まちがえた問題 ${n}問</small></button>` : ""; };
const bindNg = () => { const b = $("go-r"); if (b) b.onclick = () => startRun("p", { review: true }); };
const starsOf = (m) => (m === 0 ? 3 : m === 1 ? 2 : 1); // m = まちがい＋ヒントの数
const starStr = (n) => `<span class="stars" role="img" aria-label="星${n}つ">${"★".repeat(n)}<span class="off">${"☆".repeat(3 - n)}</span></span>`;

// ---- 記録（この端末の localStorage だけ）----
// days/hdays/adays：日付 → { m:[1問ごとのまちがい＋ヒント] }。adays はあとから遊んだ日（続けた日・今日の記録・Ko-fi には数えない）
// dex：祝日の番号 → 当てた数（祝日の帳）。runs：モードごとの途中経過（練習で今日・上級の途中を消さない）。tm：むずかしいの問題を当てた数
const fresh = () => ({ v: 1, days: {}, hdays: {}, adays: {}, dex: {}, runs: {}, tut: false, kofi: {}, ach: {}, ebest: 0, tm: 0, ng: {} });
let MODE = "d";
let mem = null; // 保存できない環境では、開いているあいだだけここに置く
const doneOf = (r) => !!r && Array.isArray(r.res) && Array.isArray(r.list) && r.res.length >= r.list.length, recOf = (r) => ({ m: r.res.map((x) => x.m) });
const runKey = (mode, date) => (mode === "a" ? "a:" + date : mode);
const bookOf = (s, m) => (m === "d" ? s.days : m === "h" ? s.hdays : m === "a" ? s.adays : null);
// 終わった回を日ごとの記録に入れる（結果を見る前に閉じても、終えた日を失わない）
function bank(s, r) { const b = doneOf(r) ? bookOf(s, r.mode) : null; if (!b || b[r.date] || (r.mode === "a" && s.days[r.date])) return false; b[r.date] = recOf(r); return true; }
const BOXES = ["days", "hdays", "adays", "dex", "runs", "kofi", "ach", "ng"];
// 保存に失敗したあとはメモリと保存の両方を読む。合わせる前に両方を fresh() で補う。数は高いほう、途中経過は同じ回なら進んだほう
function load() {
  let a = null, b = null;
  try { b = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  try { a = mem !== null ? JSON.parse(mem) : null; } catch (e) {}
  if (!a || typeof a !== "object" || a.v !== 1) a = null; if (!b || typeof b !== "object" || b.v !== 1) b = null;
  if (!a || !b) return tidy(Object.assign(fresh(), a || b || {}));
  a = tidy(Object.assign(fresh(), a)); b = tidy(Object.assign(fresh(), b));
  const [n, o] = (a.t || 0) >= (b.t || 0) ? [a, b] : [b, a], s = Object.assign(fresh(), n);
  for (const k in o) {
    if (k === "runs" || k === "t") continue;
    const x = o[k], y = n[k];
    if (x && y && typeof x === "object" && typeof y === "object") { s[k] = Object.assign({}, x, y); for (const q in x) if (typeof x[q] === "number" && typeof y[q] === "number") s[k][q] = Math.max(x[q], y[q]); }
    else if (typeof x === "number" && typeof y === "number") s[k] = Math.max(x, y);
    else if (x === true) s[k] = true;
  }
  const ra = a.runs || {}, rb = b.runs || {}, prog = (r) => (r.res ? r.res.length : 0) * 1000 + (r.cur ? (r.cur.wrong || []).length * 10 + (r.cur.hints || 0) : 0);
  s.runs = Object.assign({}, n.runs);
  for (const m of new Set([...Object.keys(ra), ...Object.keys(rb)])) {
    const x = ra[m], y = rb[m];
    if (x === undefined || y === undefined) { if (x || y) s.runs[m] = x || y; continue; }
    if (!x || !y) { const r = x || y; if (!r || bank(s, r) || doneOf(r)) continue; const bd = bookOf(s, r.mode); if (bd && !bd[r.date]) s.runs[m] = r; continue; }
    if (x.id !== y.id && x.date !== y.date) { const [w, l] = x.date > y.date ? [x, y] : [y, x]; bank(s, l); s.runs[m] = w; }
    else if (x.id === y.id) { const px = prog(x), py = prog(y); const w = px > py ? x : py > px ? y : n.runs[m]; s.runs[m] = w; if (w && w.cur && x.cur && y.cur && x.res.length === y.res.length) w.cur.wrong = [...new Set([...(x.cur.wrong || []), ...(y.cur.wrong || [])])]; }
  }
  return tidy(s);
}
// 引き継ぎコードなどから入った値を正しい形に直す（数の所に文字が入っていても画面に出さない）
const num = (v) => (typeof v === "number" || typeof v === "string") && Number.isFinite(+v) && +v >= 0 ? Math.floor(+v) : 0; // 数か文字のときだけ（{"toString":0} などで止めない）
const okDate = (v) => { if (typeof v !== "string" || !/^\d{4}-\d\d-\d\d$/.test(v)) return false; const t = Date.parse(v + "T00:00:00Z"); return Number.isFinite(t) && new Date(t).toISOString().slice(0, 10) === v; };
const has = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
const okTag = (t) => { if (typeof t !== "string") return false; const m = t.match(/^([012]):([a-zA-Z0-9]+)\|[a-z](\d{4}-\d\d-\d\d)[\w.:-]*$/); return !!m && has(G.QBY, m[2]) && G.QBY[m[2]].lv === +m[1] && okDate(m[3]); };
// 1回の問題の数（今日の5問・上級）。これと数の合わない記録は終えた日にしない
const NQ = { d: G.dailyTags(EPOCH).length, h: G.hardTags(EPOCH).length };
const NQL = { d: NQ.d, a: NQ.d, h: NQ.h, p: 5 }; // 途中経過の問題の数（とことんは決まっていない）
function tidy(s) {
  s.ebest = num(s.ebest); s.tm = num(s.tm);
  for (const q of BOXES) if (!s[q] || typeof s[q] !== "object" || Array.isArray(s[q])) s[q] = {};
  for (const k in s.dex) { if (!has(G.BY, k)) delete s.dex[k]; else s.dex[k] = num(s.dex[k]); }
  // ng：まちがえた・ヒントを使った問題 → その回数（にがて復習）。多すぎるときは回数の多いほうを残す
  for (const k in s.ng) { if (!has(G.QBY, k) || !num(s.ng[k])) delete s.ng[k]; else s.ng[k] = num(s.ng[k]); }
  { const ks = Object.keys(s.ng); if (ks.length > NGMAX) ks.sort((a, b) => s.ng[a] - s.ng[b]).slice(0, ks.length - NGMAX).forEach((k) => delete s.ng[k]); }
  const okRec = (x, n) => !!x && typeof x === "object" && Array.isArray(x.m) && x.m.length === n && x.m.every((v) => Number.isInteger(v) && v >= 0);
  for (const [b, n] of [[s.days, NQ.d], [s.hdays, NQ.h], [s.adays, NQ.d]]) for (const d in b) if (!okDate(d) || !okRec(b[d], n)) delete b[d];

  $("hintbox").innerHTML = tips.length && !cur.done ? `<div class="hint" role="status">💡 ${tips.map(esc).join("<br>💡 ")}</div>` : "";
}
function hint() { if (cur.done || cur.hints >= 2 || (!cur.P.input && cutLive(cur.P).length <= cutN(cur.P, cur.hints))) return; cur.hints++; keep(); paint(); }
function choose(v) {
  if (cur.done || cur.wrong.includes(v)) return;
  if (!same(load().runs[MODE])) { toast("別の画面で先に進んでいます"); return play(); }
  const P = cur.P;
  if (v !== P.ans) {
    buzz(40);
    cur.wrong.push(v); keep(); paint();
    const msg = $("msg"); msg.className = "msg bad";
    msg.textContent = `✕ ちがう。${G.wrongNote(P.opts[v])}`;
    return;
  }

}
// 入力の答え：ひらがな・カタカナ・全角・半角のどれでもよい
function answer(text) {
  if (cur.done || !cur.P.input) return;
  if (!G.norm(text)) return;
  if (!same(load().runs[MODE])) { toast("別の画面で先に進んでいます"); return play(); }
  if (!G.okInput(cur.P, text)) {
    buzz(40);
    if (cur.wrong.length < 4) cur.wrong.push(cur.wrong.length);
    keep(); paint();
    const msg = $("msg"); msg.className = "msg bad"; msg.textContent = `✕ ちがう（入れた名前：${esc(String(text).trim())}）`;
    $("ans").select();
    return;
  }
  win();
}
function win() {
  const P = cur.P, p = P.p, T = G.titleOf(P);
  cur.done = true; buzz([10, 40, 10]);
  // 別のタブで使ったヒント・まちがいも数えてから採点する（keep と同じ合わせ方）
  const s = save((s) => { const r = s.runs[MODE]; if (!same(r)) return; merge(r); r.res.push({ m: missOf() }); r.cur = null; if (r.mode === "e") { r.miss = (r.miss || 0) + missOf(); s.elast = P.id; } s.dex[p.no] = (s.dex[p.no] || 0) + 1; if (P.lv === 2) s.tm = (s.tm || 0) + 1; if (missOf() > 0) s.ng[P.id] = (s.ng[P.id] || 0) + 1; else delete s.ng[P.id]; });
  const r = s.runs[MODE], fin = r && r.mode !== "e" && r.res.length >= r.list.length, st = starsOf(missOf());
  paint();
  $("msg").className = "msg ok"; $("msg").textContent = `✓ 正解！ ${T.nm}。${fin ? "「結果を見る」" : "「次の問題へ」"}で進みます。`; // 前からある知らせの場所で読ませる（入れたばかりの role=status は読まれないことがある）
  $("after").innerHTML = `<div class="verdict">
    <div class="hd" data-a11y-say>✓ 正解！ ${starStr(st)}</div>
    <p class="uta" data-a11y-say>${esc(T.nm)}<small>${esc(T.sm)}</small></p>
    <ul>${G.facts(P).map((f) => `<li>${esc(f)}</li>`).join("")}</ul>
    <button class="main" id="next">${fin ? "結果を見る" : "次の問題へ"}</button></div>`;
  $("next").onclick = play;
  setTimeout(() => { if ($("next") && cur && cur.done && cur.tag === P.tag) $("next").scrollIntoView({ behavior: window.A11y && A11y.on && A11y.on("calm") ? "auto" : "smooth", block: "nearest" }); }, 60);
}

function finish() {
  const s = load(), run = s.runs[MODE];
  if (!run) return home();
  if (run.mode === "e") return endFinish(run);
  let first = false, newAch = [];
  const rec = recOf(run);
  save((s2) => {
    first = bank(s2, run);
    const c = s2.runs[MODE]; if (c && c.date === run.date && c.id === run.id) s2.runs[MODE] = null; // 別のタブで新しい回が始まっていたら、それは消さない
    newAch = achGot(s2).filter((id) => !s2.ach[id]); // まだ知らせていない実績は、前の回で取ったものも知らせる
    for (const id of newAch) s2.ach[id] = 1;

  if (run.mode === "p") return result("p", run.date, false, { list: run.list, ...rec }, newAch);
  result(run.mode, run.date, first, null, newAch);
}
// とことんの終わり：取った数を自己ベストと比べる（他の人との順位は出さない）
function endFinish(run) {

  const s = load(), best = n > prev && n > 0;
  app.innerHTML = `
    <header><button class="icon" id="back" aria-label="ホームへ">←</button><h1>祝日の由来<small>とことん</small></h1></header>

    <p class="note" id="ebest">${best ? "🎉 自己ベスト更新！" : `自己ベスト ${s.ebest}問${s.ebest > n ? `（あと${s.ebest - n + 1}問で更新）` : ""}`}<br>まちがい・ヒント ${miss}回</p>
    ${newAch.length ? `<p class="achnew" id="achnew">${newAch.map((id) => `🏅 実績：${ACH.find((a) => a[0] === id)[1]}`).join("<br>")}</p>` : ""}
    <button class="main" id="go-e">もう一度とことん</button>
    ${ngBtn()}
    <div class="row"><button class="sub" id="go-p">練習する</button><button class="sub" id="go-dex">祝日の帳を見る</button></div>
    <p class="note"><a href="${FEEDBACK}" target="_blank" rel="noopener">感想を送る</a></p>`;
  $("back").onclick = home; $("go-e").onclick = () => startRun("e"); $("go-p").onclick = () => practiceMenu(); bindNg(); $("go-dex").onclick = () => book();
  toTop();
}
// 共有の文：祝日・答えは出さない。まちがい＋ヒントの数で色と形を変える（色だけで分けない）
const sq = (m) => (m === 0 ? "🟢" : m === 1 ? "🔶" : "🔺");
function shareText(mode, k, rec) { return `祝日の由来${mode === "h" ? " 上級" : ""} 第${dayNo(k)}回 ${md(k)}\n${rec.m.map(sq).join("")}${rec.m.every((m) => m === 0) ? " まちがいなし" : ""}`; }
function untilNext() { const n = jstNow(), ms = 864e5 - (n.getTime() % 864e5); return `${Math.floor(ms / 36e5)}時間${Math.floor((ms % 36e5) / 6e4)}分`; }
function result(mode, k, first, prec, newAch = []) {

    ${(() => { const nx = nextAch(s); return nx ? `<p class="achnext" id="achnext">🎯 あと${nx.left}${nx.unit}で「${nx.name}」</p>` : ""; })()}
    <div class="rlist">${list.map((tag, j) => { const P = G.make(tag), p = P.p, T = G.titleOf(P); return `<div><span>${starStr(starsOf(rec.m[j]))}</span><span class="w"><b>${esc(T.nm)}</b>${KLB[P.kd]}・${esc(p.mi)}</span></div>`; }).join("")}</div>
    ${late ? `<p class="note">あとから遊んだ日は、カレンダーに ↺ で残ります（続けた日には数えません）。</p><button class="main alt" id="go-cal">カレンダーへ</button>` : ""}

// 祝日の帳：組ごとに、当てた祝日の形・読み・意味。まだの祝日は点線の枠と「まだ」。組ごとの練習もここから
function book() {

    <header><button class="icon" id="back" aria-label="ホームへ">←</button><h1>祝日の帳<small>${f.length}/${G.IDS.length}こ</small></h1></header>

function achView() {
  const s = load(), t = tally(s), got = achGot(s);
  app.innerHTML = `
    <header><button class="icon" id="back" aria-label="ホームへ">←</button><h1>実績<small>${got.length}/${ACH.length}</small></h1></header>
    ${AGRP.map((g, gi) => `<p class="agrp">${g}</p><div class="alist">${ACH.filter((a) => a[3] === gi).map((a) => { const ok = got.includes(a[0]), n = Math.min(t[a[4]], a[5]); return `<div class="ach${ok ? " got" : ""}" data-id="${a[0]}"><span class="ic" aria-hidden="true">🏅</span><b>${ok ? "✓ " : ""}${a[1]}</b><span class="pg">${ok ? "達成" : `${n}/${a[5]}`}</span><small>${a[2]}</small>${ok ? "" : `<span class="bar"><i style="width:${Math.round((n / a[5]) * 100)}%"></i></span>`}</div>`; }).join("")}</div>`).join("")}

// 遊んだ日のカレンダー：今日の5問の日は★（まちがいの少なさ）、あとから遊んだ日は ↺、取りこぼした過去7日は押すとあとから遊べる
const ymOf = (k) => k.slice(0, 7);
const ymAdd = (ym, n) => { const d = new Date(Date.UTC(+ym.slice(0, 4), +ym.slice(5, 7) - 1 + n, 1)); return d.toISOString().slice(0, 7); };

function cal(ym) {
  const s = load(), k = todayKey(), late = lateDays(s, k), st = streak(s.days);
  if (!ym || ym > ymOf(k)) ym = ymOf(k);
  if (ym < ymOf(EPOCH)) ym = ymOf(EPOCH);
  const y = +ym.slice(0, 4), m = +ym.slice(5, 7), dow = new Date(Date.UTC(y, m - 1, 1)).getUTCDay(), n = new Date(Date.UTC(y, m, 0)).getUTCDate(), cells = [];
  for (let i = 0; i < dow; i++) cells.push(`<span class="c off"></span>`);

    const key = `${ym}-${String(d).padStart(2, "0")}`, rec = s.days[key], ar = s.adays[key], hd = s.hdays[key] ? `<span class="hd">上</span>` : "";
    if (rec) { const lv = lvOf(rec); cells.push(`<span class="c p${lv}" data-k="${key}" role="img" aria-label="${m}月${d}日 星${lv}つ${hd ? "・上級も" : ""}">${d}<i>${"★".repeat(lv)}</i>${hd}</span>`); }
    else if (ar) cells.push(`<span class="c late" data-k="${key}" role="img" aria-label="${m}月${d}日 あとから遊んだ">${d}<i>↺</i></span>`);
    else if (late.includes(key)) { const go = s.runs[runKey("a", key)]; cells.push(`<button class="c miss" data-k="${key}" aria-label="${m}月${d}日をあとから遊ぶ${go ? "（続きから）" : ""}">${d}<i>${go ? "続き" : "▶"}</i></button>`); }
    else cells.push(`<span class="c${key === k ? " today" : ""}" data-k="${key}">${d}</span>`);
  }
  const pd = playedDays(s);

    <div class="calnav"><button class="sub" id="prev" aria-label="前の月"${ym <= ymOf(EPOCH) ? " disabled" : ""}>‹</button><b>${y}年${m}月</b><button class="sub" id="next" aria-label="次の月"${ym >= ymOf(k) ? " disabled" : ""}>›</button></div>
    <div class="cal">${["日", "月", "火", "水", "木", "金", "土"].map((w) => `<span class="wd">${w}</span>`).join("")}${cells.join("")}</div>
    <div class="legend"><span>★★★ まちがいなし</span><span>★★ 1〜2回</span><span>↺ あとから</span><span>上 上級</span><span>▶ あとから遊べる</span></div>
    ${late.length ? `<p class="note">▶ の日は、その日の5問をあとから遊べます（過去7日まで・続けた日には数えません）。</p>` : ""}
    ${footer()}`;
  $("back").onclick = home; $("prev").onclick = () => cal(ymAdd(ym, -1)); $("next").onclick = () => cal(ymAdd(ym, 1));
  document.querySelectorAll(".cal .miss").forEach((b) => (b.onclick = () => (lateDays(load()).includes(b.dataset.k) ? startRun("a", b.dataset.k) : cal(ym))));
  bindFooter(); toTop();
}

window.__op = { mode: () => MODE, load, save, todayKey, dayNo, lateDays, ACH, achGot, nextAch, tally, shareText, streak, endlessList, practiceList, cutOf, cutN, answer, cur: () => cur, play: (m) => { if (m) MODE = m; play(); }, home, cal, book, about, EPOCH, KEY, G };
